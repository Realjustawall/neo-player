name: Apply contextual UX rewrite

on:
  push:
    branches:
      - fix/spotify-ux-theme-search

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[ux2 apply]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/spotify-ux-theme-search
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply contextual UX patch
        run: |
          python3 .ux2/apply.py
          python3 .ux2/fix_escape.py

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Commit UX source changes
        run: |
          git config user.name "neo-ux-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/neoplayer/app/ui
          git diff --cached --check
          git commit -m "ux: place every feature in contextual Spotify-style navigation"
          git push origin HEAD:fix/spotify-ux-theme-search
