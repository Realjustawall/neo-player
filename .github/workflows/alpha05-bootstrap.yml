name: Alpha 0.5 Bootstrap

on:
  push:
    branches: ['alpha0.5']
    paths:
      - 'ALPHA05_CHUNKS_READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha05-bootstrap
  cancel-in-progress: false

jobs:
  apply-additive-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out alpha0.5
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify runtime overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          COUNT="$(find .alpha05/runtime_parts -maxdepth 1 -type f -name 'part*.b64' | wc -l)"
          test "$COUNT" -eq 12
          cat .alpha05/runtime_parts/part*.b64 | base64 -d > /tmp/alpha05-runtime.zip
          echo '489b45421fc9ac26fcdc0dbceae986aaa84a5c89d2624bced35ee45601d71340  /tmp/alpha05-runtime.zip' | sha256sum -c -
          test "$(stat -c %s /tmp/alpha05-runtime.zip)" -eq 106575
          unzip -t /tmp/alpha05-runtime.zip

      - name: Apply runtime overlay additively
        shell: bash
        run: |
          set -Eeuo pipefail
          unzip -o /tmp/alpha05-runtime.zip -d "$GITHUB_WORKSPACE"

      - name: Brand branch as Alpha 0.5
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 5', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.5.0-alpha"', s, count=1)
          s = re.sub(
              r'buildConfigField\("String",\s*"DISPLAY_VERSION",\s*"\\"[^\"]*\\""\)',
              'buildConfigField("String", "DISPLAY_VERSION", "\\"Alpha 0.5\\"")',
              s,
              count=1,
          )
          p.write_text(s)
          PY
          cat > ALPHA05_APPLIED.md <<'EOF'
          # NEO Player Alpha 0.5

          Full additive Alpha 0.5 source.
          All pre-existing features from base 7717f88f64e88008cc31f25b99dbbcee32fa70ea are retained and the Offline Pro/Track+ runtime overlay is applied additively.
          Runtime ZIP SHA-256: 489b45421fc9ac26fcdc0dbceae986aaa84a5c89d2624bced35ee45601d71340
          Runtime ZIP size: 106575 bytes.
          No tracked file deletion is permitted by this bootstrap.
          EOF

      - name: Require additive feature files
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f app/src/main/java/com/neoplayer/app/analysis/AdvancedAudioAnalyzer.kt
          test -f app/src/main/java/com/neoplayer/app/analysis/ReplayGainScanner.kt
          test -f app/src/main/java/com/neoplayer/app/domain/OfflineBackupEngine.kt
          test -f app/src/main/java/com/neoplayer/app/domain/LocalRecommendationEngine.kt
          test -f app/src/main/java/com/neoplayer/app/visual/LocalSpectrumAnalyzer.kt
          test -f app/src/main/java/com/neoplayer/app/visual/LocalCanvasVideo.kt
          test -f app/src/main/java/com/neoplayer/app/lyrics/OfflineLyricsTranscriber.kt
          test -f app/src/main/java/com/neoplayer/app/lyrics/LyricsForcedAligner.kt
          test -f app/src/main/java/com/neoplayer/app/ui/NeoOfflineProApp.kt

      - name: Refuse any tracked-file deletion
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          DELETED="$(git diff --cached --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$DELETED" ]; then
            echo 'Refusing Alpha 0.5 bootstrap because tracked files would be deleted:' >&2
            printf '%s\n' "$DELETED" >&2
            exit 1
          fi
          echo 'Deletion guard: PASS (0 tracked files deleted)'

      - name: Commit complete Alpha 0.5 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No new source changes to commit.'
          else
            git commit -m 'feat: apply complete additive Alpha 0.5 Offline Pro source [alpha05-applied]'
            git push origin HEAD:alpha0.5
          fi
