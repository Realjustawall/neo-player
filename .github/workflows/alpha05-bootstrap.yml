name: Alpha 0.5 Bootstrap

on:
  push:
    branches: ['alpha0.5']
    paths:
      - 'ALPHA05_LOCAL_OVERLAY_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha05-bootstrap
  cancel-in-progress: false

jobs:
  apply-additive-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out alpha0.5
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify in-branch additive overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .alpha05/overlay-v2.b64
          base64 -d .alpha05/overlay-v2.b64 > /tmp/alpha05-overlay.zip
          echo '505165e5b68c2e4629217f2d58855cbc2df7c31567742b60239a6995e655d3d6  /tmp/alpha05-overlay.zip' | sha256sum -c -
          unzip -t /tmp/alpha05-overlay.zip
          rm -rf /tmp/alpha05-overlay
          mkdir -p /tmp/alpha05-overlay
          unzip -q /tmp/alpha05-overlay.zip -d /tmp/alpha05-overlay

      - name: Apply overlay without deleting existing files
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT='/tmp/alpha05-overlay/neo-player-offline-upgrade-overlay/apply_overlay.py'
          if [ ! -f "$SCRIPT" ]; then
            SCRIPT="$(find /tmp/alpha05-overlay -name apply_overlay.py -type f | head -1)"
          fi
          test -f "$SCRIPT"
          python3 "$SCRIPT" --target "$GITHUB_WORKSPACE" --apply --allow-different-head

      - name: Brand branch as Alpha 0.5
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          s=re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 5', s, count=1)
          s=re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.5.0-alpha"', s, count=1)
          s=re.sub(r'buildConfigField\("String",\s*"DISPLAY_VERSION",\s*"\\"[^\"]*\\""\)', 'buildConfigField("String", "DISPLAY_VERSION", "\\"Alpha 0.5\\"")', s, count=1)
          p.write_text(s)
          PY
          cat > ALPHA05_APPLIED.md <<'EOF'
          # NEO Player Alpha 0.5

          Full additive Alpha 0.5 source: all pre-existing branch capabilities plus the Offline Pro/Track+ overlay.
          The overlay is stored and SHA-256 verified inside this branch. No tracked source file may be deleted by bootstrap.
          EOF

      - name: Refuse any tracked-file deletion
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          DELETED="$(git diff --cached --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$DELETED" ]; then
            echo 'Refusing Alpha 0.5 bootstrap because tracked files would be deleted:' >&2
            printf '%s\n' "$DELETED" >&2
            exit 1
          fi
          echo 'Deletion guard: PASS (0 tracked files deleted)'

      - name: Commit complete Alpha 0.5 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No new source changes to commit.'
          else
            git commit -m 'feat: apply complete additive Alpha 0.5 Offline Pro source [alpha05-applied]'
            git push origin HEAD:alpha0.5
          fi
