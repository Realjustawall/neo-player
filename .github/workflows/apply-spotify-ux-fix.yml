name: Apply Spotify UX fix

on:
  push:
    branches:
      - fix/spotify-ux-theme-search

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply ux fix]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/spotify-ux-theme-search
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply source patch
        run: python3 .uxfix/apply.py

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit patched sources
        run: |
          git config user.name "neo-ux-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/neoplayer/app/ui
          git diff --cached --check
          git commit -m "ux: integrate advanced tools into Spotify-style navigation"
          git push origin HEAD:fix/spotify-ux-theme-search
