name: Verify Spotify UX fix

on:
  push:
    branches:
      - fix/spotify-ux-theme-search

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify ux fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/spotify-ux-theme-search

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint Debug
        run: gradle --no-daemon lintDebug

      - name: Assemble Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Assemble Release APK
        run: gradle --no-daemon assembleRelease
