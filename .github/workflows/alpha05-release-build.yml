name: Alpha 0.5 Release Build (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha05-release-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out alpha0.5
        uses: actions/checkout@v4

      - name: Require complete Alpha 0.5 source
        run: |
          test -f ALPHA05_APPLIED.md
          echo "Building commit $GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and release lint
        run: gradle --no-daemon testDebugUnitTest lintRelease

      - name: Build release APK and AAB
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Capture exact binary sizes
        run: |
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -1)"
          test -n "$APK" && test -f "$APK"
          test -n "$AAB" && test -f "$AAB"
          APK_BYTES="$(stat -c %s "$APK")"
          AAB_BYTES="$(stat -c %s "$AAB")"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
          printf 'APK_BYTES=%s\nAAB_BYTES=%s\n' "$APK_BYTES" "$AAB_BYTES" | tee alpha05-build-sizes.txt
          ls -lh "$APK" "$AAB"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NEO-PLAYER-alpha0.5-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NEO-PLAYER-alpha0.5-release-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: NEO-PLAYER-alpha0.5-size-report
          path: alpha05-build-sizes.txt
          if-no-files-found: error
          retention-days: 30
