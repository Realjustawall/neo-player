name: Release 0.8Alpha from Main

on:
  push:
    branches: [main]
    paths:
      - 'ALPHA08_MAIN_RELEASE_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-alpha08-main
  cancel-in-progress: false

jobs:
  build-sign:
    name: Build, test, lint, sign 0.8Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NEO_RELEASE_STORE_PASSWORD: ${{ secrets.NEO_RELEASE_STORE_PASSWORD }}
      NEO_RELEASE_KEY_ALIAS: ${{ secrets.NEO_RELEASE_KEY_ALIAS }}
      NEO_RELEASE_KEY_PASSWORD: ${{ secrets.NEO_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify 0.8Alpha release source and rollback branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "main"
          test -f app/src/main/java/com/neoplayer/app/analysis/AdvancedAudioAnalyzer.kt
          test -f app/src/main/java/com/neoplayer/app/domain/OfflineBackupEngine.kt
          test -f app/src/main/java/com/neoplayer/app/visual/LocalSpectrumAnalyzer.kt
          test -f app/src/main/java/com/neoplayer/app/lyrics/OfflineBuiltInModelStore.kt
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'versionName = "0.8.0-alpha"' app/build.gradle.kts
          git ls-remote --exit-code --heads origin backup-main-before-alpha0.6-2026-09-18

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare optional production signing
        shell: bash
        env:
          NEO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NEO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          if [ -n "${NEO_RELEASE_KEYSTORE_BASE64:-}" ] && \
             [ -n "${NEO_RELEASE_STORE_PASSWORD:-}" ] && \
             [ -n "${NEO_RELEASE_KEY_ALIAS:-}" ] && \
             [ -n "${NEO_RELEASE_KEY_PASSWORD:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/neo-release.jks"
            printf '%s' "$NEO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"
            echo "NEO_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "NEO_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "NEO_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Restore persistent Alpha test signing key
        id: alpha-key-cache
        if: env.NEO_RELEASE_SIGNED != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ci/alpha-signing
          key: neo-player-alpha-signing-v1

      - name: Prepare Alpha test signing key
        if: env.NEO_RELEASE_SIGNED != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .ci/alpha-signing
          KEYSTORE="$GITHUB_WORKSPACE/.ci/alpha-signing/neo-alpha.jks"
          PASSFILE="$GITHUB_WORKSPACE/.ci/alpha-signing/password.txt"
          if [ ! -s "$KEYSTORE" ] || [ ! -s "$PASSFILE" ]; then
            PASS="$(openssl rand -hex 24)"
            printf '%s' "$PASS" > "$PASSFILE"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" \
              -alias neoalpha -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=NEO PLAYER Alpha Install,OU=Testing,O=NEO PLAYER,C=US"
          fi
          PASS="$(cat "$PASSFILE")"
          echo "::add-mask::$PASS"
          echo "ALPHA_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ALPHA_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$PASS" -alias neoalpha | grep -E 'Alias name:|SHA256:'

      - name: Persist Alpha test signing key immediately
        if: env.NEO_RELEASE_SIGNED != 'true' && steps.alpha-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/alpha-signing
          key: neo-player-alpha-signing-v1

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint Release
        run: gradle --no-daemon lintRelease

      - name: Build Release APK and AAB
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Sign 0.8Alpha package and verify signatures
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          RAW_AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -1)"
          test -s "$RAW_APK"
          test -s "$RAW_AAB"
          OUT_APK="$GITHUB_WORKSPACE/NEO-PLAYER-0.8Alpha-release.apk"
          OUT_AAB="$GITHUB_WORKSPACE/NEO-PLAYER-0.8Alpha-release.aab"
          if [ "${NEO_RELEASE_SIGNED:-false}" = "true" ]; then
            cp "$RAW_APK" "$OUT_APK"
            cp "$RAW_AAB" "$OUT_AAB"
            SIGNING_MODE=production
          else
            ALIGNED="$RUNNER_TEMP/neo-alpha06-aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$RAW_APK" "$ALIGNED"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$ALPHA_KEYSTORE" --ks-key-alias neoalpha \
              --ks-pass "pass:$ALPHA_KEY_PASSWORD" --key-pass "pass:$ALPHA_KEY_PASSWORD" \
              --out "$OUT_APK" "$ALIGNED"
            cp "$RAW_AAB" "$OUT_AAB"
            jarsigner -keystore "$ALPHA_KEYSTORE" -storepass "$ALPHA_KEY_PASSWORD" -keypass "$ALPHA_KEY_PASSWORD" \
              -sigalg SHA256withRSA -digestalg SHA-256 "$OUT_AAB" neoalpha
            SIGNING_MODE=alpha-test
          fi
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$OUT_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT_APK" | tee apk-signature.txt
          jarsigner -verify "$OUT_AAB" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$OUT_APK" | tee apk-badging.txt
          grep -q "package: name='com.neoplayer.app'" apk-badging.txt
          grep -q "versionCode='8'" apk-badging.txt
          grep -q "versionName='0.8.0-alpha'" apk-badging.txt
          APK_BYTES="$(stat -c %s "$OUT_APK")"
          AAB_BYTES="$(stat -c %s "$OUT_AAB")"
          # 0.8Alpha is intentionally additive and must remain larger than the complete 0.7Alpha APK.
          test "$APK_BYTES" -gt 46157482
          test "$APK_BYTES" -le 65000000
          APK_MIB="$(awk -v b="$APK_BYTES" 'BEGIN { printf "%.3f", b/1048576 }')"
          AAB_MIB="$(awk -v b="$AAB_BYTES" 'BEGIN { printf "%.3f", b/1048576 }')"
          CERT_SHA256="$(grep -m1 'Signer #1 certificate SHA-256 digest:' apk-signature.txt | sed 's/.*: //')"
          APK_SHA256="$(sha256sum "$OUT_APK" | awk '{print $1}')"
          AAB_SHA256="$(sha256sum "$OUT_AAB" | awk '{print $1}')"
          cat > RELEASE_ALPHA08_BUILD.txt <<EOF
          TAG=v0.8.0-alpha
          BUILD_SHA=$GITHUB_SHA
          PACKAGE=com.neoplayer.app
          VERSION_CODE=8
          VERSION_NAME=0.8.0-alpha
          APK_BYTES=$APK_BYTES
          APK_MIB=$APK_MIB
          APK_SHA256=$APK_SHA256
          AAB_BYTES=$AAB_BYTES
          AAB_MIB=$AAB_MIB
          AAB_SHA256=$AAB_SHA256
          SIGNING_MODE=$SIGNING_MODE
          APK_SIGNATURE_VERIFIED=true
          ZIPALIGN_16K_VERIFIED=true
          CERT_SHA256=$CERT_SHA256
          BACKUP_BRANCH=backup-main-before-alpha0.6-2026-09-18
          EOF
          cat RELEASE_ALPHA08_BUILD.txt

      - name: Upload signed 0.8Alpha candidate
        uses: actions/upload-artifact@v4
        with:
          name: alpha08-signed-candidate
          path: |
            NEO-PLAYER-0.8Alpha-release.apk
            NEO-PLAYER-0.8Alpha-release.aab
            RELEASE_ALPHA08_BUILD.txt
            apk-signature.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30

  install-verify:
    name: Install and launch 0.8Alpha on Ubuntu KVM emulator
    needs: build-sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verification script
        uses: actions/checkout@v4

      - name: Download signed candidate
        uses: actions/download-artifact@v4
        with:
          name: alpha08-signed-candidate
          path: candidate

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install APK and launch app on KVM emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash "$GITHUB_WORKSPACE/.github/scripts/verify-alpha06-install.sh"

      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha08-install-evidence
          path: |
            INSTALL_ALPHA08_KVM_VERIFICATION.txt
            runtime-result.txt
            crash-summary.txt
            logcat.txt
            activity-processes.txt
            exit-info.txt
            install-output.txt
            package-service.txt
            package-path.txt
            package-version.txt
            launch-output.txt
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Publish verified NEO PLAYER 0.8Alpha
    needs: [build-sign, install-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download signed candidate
        uses: actions/download-artifact@v4
        with:
          name: alpha08-signed-candidate
          path: candidate

      - name: Download install evidence
        uses: actions/download-artifact@v4
        with:
          name: alpha08-install-evidence
          path: evidence

      - name: Final verification gate
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^APK_SIGNATURE_VERIFIED=true$' candidate/RELEASE_ALPHA08_BUILD.txt
          grep -q '^ZIPALIGN_16K_VERIFIED=true$' candidate/RELEASE_ALPHA08_BUILD.txt
          grep -q '^INSTALL_TEST=PASS$' evidence/INSTALL_ALPHA08_KVM_VERIFICATION.txt
          cat evidence/INSTALL_ALPHA08_KVM_VERIFICATION.txt >> candidate/RELEASE_ALPHA08_BUILD.txt
          cat candidate/RELEASE_ALPHA08_BUILD.txt

      - name: Create or update GitHub Release 0.8Alpha
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG=v0.8.0-alpha
          NOTES='0.8Alpha removes the first-frame theme flash, repairs compact Persian queue and Now Playing layouts, puts Local Radio beside Settings, refreshes host timing for reliable synchronized playback, and makes the equalizer fully opt-in with every dependent control disabled while it is off. Every existing NEO+/Track+/Offline Pro, favorite, playlist, lyric, playback, and visual capability remains available. This candidate passed unit tests, lint, release assembly, signature verification, 16 KiB zip alignment, Android 14/API 34 KVM installation, launch, and runtime health checks.'
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "NEO PLAYER 0.8Alpha" \
              --notes "$NOTES"
          fi
          gh release upload "$TAG" \
            candidate/NEO-PLAYER-0.8Alpha-release.apk \
            candidate/NEO-PLAYER-0.8Alpha-release.aab \
            candidate/RELEASE_ALPHA08_BUILD.txt \
            evidence/INSTALL_ALPHA08_KVM_VERIFICATION.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NEO PLAYER 0.8Alpha" \
            --latest \
            --prerelease=false \
            --notes "$NOTES"
