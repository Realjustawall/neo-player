name: Capture released Android UI for README
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-readme-ui.yml
      - .github/scripts/capture-readme-ui.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the published Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --connect-timeout 15 --max-time 180 --retry 1 --output NEO-PLAYER-0.8Alpha-release.apk https://github.com/Realjustawall/neo-player/releases/download/v0.8.0-alpha/NEO-PLAYER-0.8Alpha-release.apk
          echo "8214014ab33a197dc527f5a830c48d93032b4f60db7280f6aecae78237222d4b  NEO-PLAYER-0.8Alpha-release.apk" | sha256sum --check
          sha256sum NEO-PLAYER-0.8Alpha-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod a+rw /dev/kvm
          test -w /dev/kvm
      - name: Capture the real English and Persian UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: python .github/scripts/capture-readme-ui.py
      - name: Upload screenshots and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo-player-readme-ui
          path: android-readme-captures/
          if-no-files-found: error
          retention-days: 30
