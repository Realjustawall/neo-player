name: Alpha 0.5 Verified Runtime Repair

on:
  push:
    branches: ['alpha0.5']
    paths:
      - 'ALPHA05_REPAIR_READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha05-runtime-repair
  cancel-in-progress: false

jobs:
  repair-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out alpha0.5
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and verify all runtime chunks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = [
              (12000, 'e311e4e5fbbc5628ffc3a00931c9874c698238ad7a302258f2e05e1f133cf26c'),
              (12000, 'b0a462749fab2f33181505f2e2d4726b9b5c7b29393e815323ff95b8ef6d80ae'),
              (12000, '9460f1613bd4007517eee983d5dbb7b3b3ec87918d3957c4ed6bc597f7c95364'),
              (12000, '173b2f298ed786b7a0fee73cd13ad491e8d08497c0a2a2660fcd6478245434e2'),
              (12000, '5af312218b512e594e99673eb783d8aa50ef99894ae6c1f0a282c9c6fd552948'),
              (12000, '02106a9d3f3cd1ffb8de85ba579b649b40d47b0dd90474e5a37c28ae35a2e28b'),
              (12000, '05e1bbf446d726c9574faaf793c6b929ab3f8958e04217c92809ba7b4705f16e'),
              (12000, 'efaa5e22db301a3ccc5da58c66064630920182c1384a1c35ff8dc72328694b36'),
              (12000, '7aebfd70d8de50cc3394ac3992fb818fd3993d900eba1f180fc0b3e3c66243c6'),
              (12000, '81b45dc1f5dd6de88e11888f396a5eaa63bf5daca09b3983010b5d29f68af414'),
              (12000, '1f3619afddf634187a6464739c2330dc21262554632e9416baa37689479cf2ff'),
              (10100, '7ff16c2f74b12a8c00d531ddaef823b5832a3b2a261ccd00517e3fb0bb583c85'),
          ]
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def recover(data, wanted_len, wanted_sha, label):
              if len(data) == wanted_len and sha(data) == wanted_sha:
                  print(f'{label}: exact')
                  return data

              compact = b''.join(data.split())
              if len(compact) == wanted_len and sha(compact) == wanted_sha:
                  print(f'{label}: repaired whitespace corruption')
                  return compact

              if len(data) == wanted_len - 1:
                  for pos in range(len(data) + 1):
                      left, right = data[:pos], data[pos:]
                      for ch in alphabet:
                          candidate = left + bytes((ch,)) + right
                          if sha(candidate) == wanted_sha:
                              print(f'{label}: inserted {chr(ch)!r} at {pos}')
                              return candidate

              if len(data) == wanted_len + 1:
                  for pos in range(len(data)):
                      candidate = data[:pos] + data[pos + 1:]
                      if sha(candidate) == wanted_sha:
                          print(f'{label}: removed extra byte at {pos}')
                          return candidate

              if len(data) == wanted_len:
                  for pos, old in enumerate(data):
                      left, right = data[:pos], data[pos + 1:]
                      for ch in alphabet:
                          if ch == old:
                              continue
                          candidate = left + bytes((ch,)) + right
                          if sha(candidate) == wanted_sha:
                              print(f'{label}: substituted offset {pos} with {chr(ch)!r}')
                              return candidate

              raise SystemExit(f'{label}: unrecoverable size={len(data)} sha={sha(data)}')

          root = Path('.alpha05/runtime_parts')
          for index, (wanted_len, wanted_sha) in enumerate(expected):
              path = root / f'part{index:02d}.b64'
              data = path.read_bytes()
              fixed = recover(data, wanted_len, wanted_sha, path.name)
              path.write_bytes(fixed)
              assert len(fixed) == wanted_len
              assert sha(fixed) == wanted_sha
          PY
          cat .alpha05/runtime_parts/part{00..11}.b64 | base64 -d > /tmp/alpha05-runtime.zip
          echo '489b45421fc9ac26fcdc0dbceae986aaa84a5c89d2624bced35ee45601d71340  /tmp/alpha05-runtime.zip' | sha256sum -c -
          test "$(stat -c %s /tmp/alpha05-runtime.zip)" -eq 106575
          unzip -t /tmp/alpha05-runtime.zip

      - name: Apply verified runtime overlay additively
        shell: bash
        run: |
          set -Eeuo pipefail
          unzip -o /tmp/alpha05-runtime.zip -d "$GITHUB_WORKSPACE"

      - name: Brand Alpha 0.5
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 5', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.5.0-alpha"', s, count=1)
          s = re.sub(r'buildConfigField\("String",\s*"DISPLAY_VERSION",\s*"\\"[^\"]*\\""\)', 'buildConfigField("String", "DISPLAY_VERSION", "\\"Alpha 0.5\\"")', s, count=1)
          p.write_text(s)
          PY
          cat > ALPHA05_APPLIED.md <<'EOF'
          # NEO Player Alpha 0.5

          Full additive Alpha 0.5 source is applied on top of base 7717f88f64e88008cc31f25b99dbbcee32fa70ea.
          Runtime ZIP SHA-256: 489b45421fc9ac26fcdc0dbceae986aaa84a5c89d2624bced35ee45601d71340
          Runtime ZIP size: 106575 bytes.
          All runtime chunk hashes were independently verified before extraction.
          No tracked-file deletion is permitted.
          EOF

      - name: Require additive feature set
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in \
            app/src/main/java/com/neoplayer/app/analysis/AdvancedAudioAnalyzer.kt \
            app/src/main/java/com/neoplayer/app/analysis/ReplayGainScanner.kt \
            app/src/main/java/com/neoplayer/app/domain/OfflineBackupEngine.kt \
            app/src/main/java/com/neoplayer/app/domain/LocalRecommendationEngine.kt \
            app/src/main/java/com/neoplayer/app/visual/LocalSpectrumAnalyzer.kt \
            app/src/main/java/com/neoplayer/app/visual/LocalCanvasVideo.kt \
            app/src/main/java/com/neoplayer/app/lyrics/OfflineLyricsTranscriber.kt \
            app/src/main/java/com/neoplayer/app/lyrics/LyricsForcedAligner.kt \
            app/src/main/java/com/neoplayer/app/ui/NeoOfflineProApp.kt; do
              test -f "$f"
          done

      - name: Refuse tracked-file deletion
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          DELETED="$(git diff --cached --name-status | awk '$1 ~ /^D/ {print}')"
          if [ -n "$DELETED" ]; then
            echo 'Refusing commit because tracked files would be deleted:' >&2
            printf '%s\n' "$DELETED" >&2
            exit 1
          fi
          echo 'Deletion guard: PASS (0 tracked files deleted)'

      - name: Commit verified Alpha 0.5 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'feat: apply complete verified additive Alpha 0.5 runtime [alpha05-applied]'
            git push origin HEAD:alpha0.5
          fi
