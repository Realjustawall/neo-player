name: Force replace source

on:
  push:
    branches: [main]
    paths: ['.replace/**', '.github/workflows/replace-source.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify source archive
        run: |
          cat .replace/chunk_* > /tmp/neo-source.b64
          base64 --decode /tmp/neo-source.b64 > /tmp/neo-source.tar.xz
          test "$(sha256sum /tmp/neo-source.tar.xz | awk '{print $1}')" = "dd1de197c2e454c8e857bca1ab1e3d35742fbd7b901bf6c0a93eb4f9553728fa"
      - name: Force working tree to NEO PLAYER 0.8 source
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/neo-source.tar.xz -C .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace repository with NEO PLAYER 0.8 Ultimate Release" || true
          git push origin HEAD:main --force
