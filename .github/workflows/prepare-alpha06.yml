name: Prepare 0.6Alpha

on:
  push:
    branches: ['fix/spotify-ux-theme-search']
    paths: ['.release06/apply.py']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 0.6Alpha source preparation
        run: python .release06/apply.py
      - name: Commit prepared 0.6Alpha source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare 0.6Alpha source"
          git push
