name: Release Alpha 0.5 from Main

on:
  push:
    branches: [main]
    paths:
      - 'ALPHA05_MAIN_RELEASE_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-alpha05-main
  cancel-in-progress: false

jobs:
  build-sign:
    name: Build, test, lint, sign
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NEO_RELEASE_STORE_PASSWORD: ${{ secrets.NEO_RELEASE_STORE_PASSWORD }}
      NEO_RELEASE_KEY_ALIAS: ${{ secrets.NEO_RELEASE_KEY_ALIAS }}
      NEO_RELEASE_KEY_PASSWORD: ${{ secrets.NEO_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source and rollback branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "main"
          test -f ALPHA05_APPLIED.md
          test -f app/src/main/java/com/neoplayer/app/analysis/AdvancedAudioAnalyzer.kt
          test -f app/src/main/java/com/neoplayer/app/domain/OfflineBackupEngine.kt
          test -f app/src/main/java/com/neoplayer/app/visual/LocalSpectrumAnalyzer.kt
          test -f app/src/main/java/com/neoplayer/app/lyrics/OfflineBuiltInModelStore.kt
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 5' app/build.gradle.kts
          grep -q 'versionName = "0.5.0-alpha"' app/build.gradle.kts
          git ls-remote --exit-code --heads origin backup-main-before-alpha0.5-2026-09-17

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare optional production signing
        shell: bash
        env:
          NEO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NEO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          if [ -n "${NEO_RELEASE_KEYSTORE_BASE64:-}" ] && \
             [ -n "${NEO_RELEASE_STORE_PASSWORD:-}" ] && \
             [ -n "${NEO_RELEASE_KEY_ALIAS:-}" ] && \
             [ -n "${NEO_RELEASE_KEY_PASSWORD:-}" ]; then
            KEYSTORE="$RUNNER_TEMP/neo-release.jks"
            printf '%s' "$NEO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"
            echo "NEO_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "NEO_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "NEO_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Restore persistent Alpha test signing key
        id: alpha-key-cache
        if: env.NEO_RELEASE_SIGNED != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ci/alpha-signing
          key: neo-player-alpha-signing-v1

      - name: Prepare Alpha test signing key
        if: env.NEO_RELEASE_SIGNED != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .ci/alpha-signing
          KEYSTORE="$GITHUB_WORKSPACE/.ci/alpha-signing/neo-alpha.jks"
          PASSFILE="$GITHUB_WORKSPACE/.ci/alpha-signing/password.txt"
          if [ ! -s "$KEYSTORE" ] || [ ! -s "$PASSFILE" ]; then
            PASS="$(openssl rand -hex 24)"
            printf '%s' "$PASS" > "$PASSFILE"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" \
              -alias neoalpha -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=NEO PLAYER Alpha Install,OU=Testing,O=NEO PLAYER,C=US"
          fi
          PASS="$(cat "$PASSFILE")"
          echo "::add-mask::$PASS"
          echo "ALPHA_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ALPHA_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$PASS" -alias neoalpha | grep -E 'Alias name:|SHA256:'

      - name: Persist Alpha test signing key immediately
        if: env.NEO_RELEASE_SIGNED != 'true' && steps.alpha-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/alpha-signing
          key: neo-player-alpha-signing-v1

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint Release
        run: gradle --no-daemon lintRelease

      - name: Build Release APK and AAB
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Sign fallback Alpha package and verify signatures
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          RAW_AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -1)"
          test -s "$RAW_APK"
          test -s "$RAW_AAB"
          OUT_APK="$GITHUB_WORKSPACE/NEO-PLAYER-Alpha-0.5-release.apk"
          OUT_AAB="$GITHUB_WORKSPACE/NEO-PLAYER-Alpha-0.5-release.aab"
          if [ "${NEO_RELEASE_SIGNED:-false}" = "true" ]; then
            cp "$RAW_APK" "$OUT_APK"
            cp "$RAW_AAB" "$OUT_AAB"
            SIGNING_MODE=production
          else
            ALIGNED="$RUNNER_TEMP/neo-alpha-aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$RAW_APK" "$ALIGNED"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$ALPHA_KEYSTORE" --ks-key-alias neoalpha \
              --ks-pass "pass:$ALPHA_KEY_PASSWORD" --key-pass "pass:$ALPHA_KEY_PASSWORD" \
              --out "$OUT_APK" "$ALIGNED"
            cp "$RAW_AAB" "$OUT_AAB"
            jarsigner -keystore "$ALPHA_KEYSTORE" -storepass "$ALPHA_KEY_PASSWORD" -keypass "$ALPHA_KEY_PASSWORD" \
              -sigalg SHA256withRSA -digestalg SHA-256 "$OUT_AAB" neoalpha
            SIGNING_MODE=alpha-test
          fi
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$OUT_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT_APK" | tee apk-signature.txt
          jarsigner -verify "$OUT_AAB" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$OUT_APK" | tee apk-badging.txt
          grep -q "package: name='com.neoplayer.app'" apk-badging.txt
          grep -q "versionCode='5'" apk-badging.txt
          APK_BYTES="$(stat -c %s "$OUT_APK")"
          AAB_BYTES="$(stat -c %s "$OUT_AAB")"
          PREVIOUS_APK_BYTES=25039976
          MAX_REASONABLE_APK_BYTES=60000000
          test "$APK_BYTES" -gt "$PREVIOUS_APK_BYTES"
          test "$APK_BYTES" -le "$MAX_REASONABLE_APK_BYTES"
          APK_MIB="$(awk -v b="$APK_BYTES" 'BEGIN { printf "%.3f", b/1048576 }')"
          AAB_MIB="$(awk -v b="$AAB_BYTES" 'BEGIN { printf "%.3f", b/1048576 }')"
          CERT_SHA256="$(grep -m1 'Signer #1 certificate SHA-256 digest:' apk-signature.txt | sed 's/.*: //')"
          cat > RELEASE_ALPHA05_BUILD.txt <<EOF
          TAG=v0.5.0-alpha
          BUILD_SHA=$GITHUB_SHA
          PACKAGE=com.neoplayer.app
          VERSION_CODE=5
          VERSION_NAME=0.5.0-alpha
          APK_BYTES=$APK_BYTES
          APK_MIB=$APK_MIB
          AAB_BYTES=$AAB_BYTES
          AAB_MIB=$AAB_MIB
          SIGNING_MODE=$SIGNING_MODE
          APK_SIGNATURE_VERIFIED=true
          ZIPALIGN_16K_VERIFIED=true
          CERT_SHA256=$CERT_SHA256
          BACKUP_BRANCH=backup-main-before-alpha0.5-2026-09-17
          BACKUP_SHA=3bd4b16ed7a81d9c786bfd009fb0382145b294b4
          EOF
          cat RELEASE_ALPHA05_BUILD.txt

      - name: Upload signed candidate for install verification
        uses: actions/upload-artifact@v4
        with:
          name: alpha05-signed-candidate
          path: |
            NEO-PLAYER-Alpha-0.5-release.apk
            NEO-PLAYER-Alpha-0.5-release.aab
            RELEASE_ALPHA05_BUILD.txt
            apk-signature.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 7

  install-verify:
    name: Install and launch on Android emulator
    needs: build-sign
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Download signed candidate
        uses: actions/download-artifact@v4
        with:
          name: alpha05-signed-candidate
          path: candidate

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install APK and launch app on hardware-accelerated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -Eeuo pipefail
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell service check package | tee package-service.txt
            grep -q 'package: found' package-service.txt
            adb install --no-incremental -r "$GITHUB_WORKSPACE/candidate/NEO-PLAYER-Alpha-0.5-release.apk" | tee install-output.txt
            grep -q 'Success' install-output.txt
            adb shell pm path com.neoplayer.app | tee package-path.txt
            grep -q 'package:' package-path.txt
            adb shell dumpsys package com.neoplayer.app | grep -E 'versionCode=5|versionName=0.5.0-alpha' | tee package-version.txt
            grep -q 'versionCode=5' package-version.txt
            grep -q 'versionName=0.5.0-alpha' package-version.txt
            adb shell am force-stop com.neoplayer.app
            adb shell am start -W -n com.neoplayer.app/.MainActivity | tee launch-output.txt
            grep -q 'Status: ok' launch-output.txt
            sleep 5
            PID="$(adb shell pidof com.neoplayer.app | tr -d '\r')"
            test -n "$PID"
            printf 'INSTALL_TEST=PASS\nEMULATOR=Android_15_API_35_google_apis_x86_64\nRUNNER=macos-15-intel\nPACKAGE=com.neoplayer.app\nVERSION_CODE=5\nVERSION_NAME=0.5.0-alpha\nPID=%s\n' "$PID" > INSTALL_ALPHA05_VERIFICATION.txt
            cat INSTALL_ALPHA05_VERIFICATION.txt

      - name: Upload install evidence
        uses: actions/upload-artifact@v4
        with:
          name: alpha05-install-evidence
          path: |
            INSTALL_ALPHA05_VERIFICATION.txt
            install-output.txt
            package-service.txt
            package-path.txt
            package-version.txt
            launch-output.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified installable Alpha 0.5
    needs: [build-sign, install-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download signed candidate
        uses: actions/download-artifact@v4
        with:
          name: alpha05-signed-candidate
          path: candidate

      - name: Download install evidence
        uses: actions/download-artifact@v4
        with:
          name: alpha05-install-evidence
          path: evidence

      - name: Final verification gate
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q '^APK_SIGNATURE_VERIFIED=true$' candidate/RELEASE_ALPHA05_BUILD.txt
          grep -q '^ZIPALIGN_16K_VERIFIED=true$' candidate/RELEASE_ALPHA05_BUILD.txt
          grep -q '^INSTALL_TEST=PASS$' evidence/INSTALL_ALPHA05_VERIFICATION.txt
          cat evidence/INSTALL_ALPHA05_VERIFICATION.txt >> candidate/RELEASE_ALPHA05_BUILD.txt
          cat candidate/RELEASE_ALPHA05_BUILD.txt

      - name: Replace GitHub Release assets only after real install passes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload v0.5.0-alpha \
            candidate/NEO-PLAYER-Alpha-0.5-release.apk \
            candidate/NEO-PLAYER-Alpha-0.5-release.aab \
            candidate/RELEASE_ALPHA05_BUILD.txt \
            evidence/INSTALL_ALPHA05_VERIFICATION.txt \
            --clobber
          gh release edit v0.5.0-alpha \
            --title "NEO PLAYER Alpha 0.5" \
            --latest \
            --prerelease=false \
            --notes "Alpha 0.5 from main. The Release APK is cryptographically signed, verified by apksigner, 16 KiB zip-alignment checked, and successfully installed and launched on an Android 15 / API 35 emulator running on GitHub's macos-15-intel runner. If production signing secrets are configured they are used; otherwise the persistent Alpha test signing key is used. For Play Store publishing, configure the production upload/release signing key. Rollback branch: backup-main-before-alpha0.5-2026-09-17."
