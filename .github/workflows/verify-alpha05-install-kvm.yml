name: Verify Alpha 0.5 Install on KVM Emulator

on:
  push:
    branches: [main]
    paths:
      - 'VERIFY_ALPHA05_KVM_TRIGGER'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verification script
        uses: actions/checkout@v4

      - name: Download exact signed Alpha 0.5 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10516869733/zip > candidate.zip
          unzip -q candidate.zip -d candidate
          test -s candidate/NEO-PLAYER-Alpha-0.5-release.apk
          grep -q '^APK_SIGNATURE_VERIFIED=true$' candidate/RELEASE_ALPHA05_BUILD.txt
          grep -q '^ZIPALIGN_16K_VERIFIED=true$' candidate/RELEASE_ALPHA05_BUILD.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install APK and launch on KVM Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash "$GITHUB_WORKSPACE/.github/scripts/verify-alpha05-install.sh"

      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha05-kvm-install-evidence
          path: |
            INSTALL_ALPHA05_KVM_VERIFICATION.txt
            runtime-result.txt
            crash-summary.txt
            logcat.txt
            activity-processes.txt
            exit-info.txt
            install-output.txt
            package-service.txt
            package-path.txt
            package-version.txt
            launch-output.txt
          if-no-files-found: warn
          retention-days: 90
