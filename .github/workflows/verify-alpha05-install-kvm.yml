name: Verify Alpha 0.5 Install on KVM Emulator

on:
  push:
    branches: [main]
    paths:
      - 'VERIFY_ALPHA05_KVM_TRIGGER'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download exact signed Alpha 0.5 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10516869733/zip > candidate.zip
          unzip -q candidate.zip -d candidate
          test -s candidate/NEO-PLAYER-Alpha-0.5-release.apk
          grep -q '^APK_SIGNATURE_VERIFIED=true$' candidate/RELEASE_ALPHA05_BUILD.txt
          grep -q '^ZIPALIGN_16K_VERIFIED=true$' candidate/RELEASE_ALPHA05_BUILD.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install APK and launch on KVM Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            set -Eeuo pipefail
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 2; done
            adb shell service check package | tee package-service.txt
            grep -q 'package: found' package-service.txt
            adb install --no-incremental -r "$GITHUB_WORKSPACE/candidate/NEO-PLAYER-Alpha-0.5-release.apk" | tee install-output.txt
            grep -q 'Success' install-output.txt
            adb shell pm path com.neoplayer.app | tee package-path.txt
            grep -q 'package:' package-path.txt
            adb shell dumpsys package com.neoplayer.app | grep -E 'versionCode=5|versionName=0.5.0-alpha' | tee package-version.txt
            grep -q 'versionCode=5' package-version.txt
            grep -q 'versionName=0.5.0-alpha' package-version.txt
            adb shell am force-stop com.neoplayer.app
            adb shell am start -W -n com.neoplayer.app/.MainActivity | tee launch-output.txt
            grep -q 'Status: ok' launch-output.txt
            sleep 5
            PID="$(adb shell pidof com.neoplayer.app | tr -d '\r')"
            test -n "$PID"
            printf 'INSTALL_TEST=PASS\nEMULATOR=Android_14_API_34_default_x86_64_KVM\nRUNNER=ubuntu-latest\nPACKAGE=com.neoplayer.app\nVERSION_CODE=5\nVERSION_NAME=0.5.0-alpha\nPID=%s\n' "$PID" > INSTALL_ALPHA05_KVM_VERIFICATION.txt
            cat INSTALL_ALPHA05_KVM_VERIFICATION.txt

      - name: Upload install evidence
        uses: actions/upload-artifact@v4
        with:
          name: alpha05-kvm-install-evidence
          path: |
            INSTALL_ALPHA05_KVM_VERIFICATION.txt
            install-output.txt
            package-service.txt
            package-path.txt
            package-version.txt
            launch-output.txt
          if-no-files-found: error
          retention-days: 90
