name: Android Alpha

on:
  push:
    branches: [main, develop, 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project versions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -q 'version "8.13.2"' build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'versionName = "0.8.0-alpha"' app/build.gradle.kts

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint Debug
        run: gradle --no-daemon lintDebug

      - name: Assemble installable Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Assemble Release APK
        run: gradle --no-daemon assembleRelease

      - name: Name 0.8Alpha artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -s "$DEBUG_APK"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          echo "Debug APK: $DEBUG_APK"
          echo "Release APK: $RELEASE_APK"
          cp "$DEBUG_APK" NEO-PLAYER-0.8Alpha-debug.apk
          cp "$RELEASE_APK" NEO-PLAYER-0.8Alpha-release-unsigned.apk
          echo "APK_ARTIFACT=NEO-PLAYER-0.8Alpha" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=NEO PLAYER 0.8Alpha" >> "$GITHUB_ENV"

      - name: Verify Debug APK package metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging NEO-PLAYER-0.8Alpha-debug.apk | tee debug-badging.txt
          grep -q "package: name='com.neoplayer.app' versionCode='8' versionName='0.8.0-alpha'" debug-badging.txt

      - name: Upload 0.8Alpha APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: |
            NEO-PLAYER-0.8Alpha-debug.apk
            NEO-PLAYER-0.8Alpha-release-unsigned.apk
            debug-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged Alpha release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" NEO-PLAYER-0.8Alpha-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file CHANGELOG.md \
              --prerelease
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
