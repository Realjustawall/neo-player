name: Android Alpha

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test, lint, and assemble Alpha
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Name installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NEO-PLAYER-Alpha-0.1.apk

      - name: Upload Alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: NEO-PLAYER-Alpha-0.1
          path: NEO-PLAYER-Alpha-0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish initial private release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.0-alpha >/dev/null 2>&1; then
            gh release create v0.1.0-alpha NEO-PLAYER-Alpha-0.1.apk \
              --target "$GITHUB_SHA" \
              --title "NEO PLAYER Alpha 0.1" \
              --notes-file CHANGELOG.md
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
