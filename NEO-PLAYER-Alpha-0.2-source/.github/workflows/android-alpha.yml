name: Android Alpha

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test, lint, and assemble Alpha
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Select versioned artifact name
        run: |
          if [[ "$GITHUB_REF" == "refs/tags/v0.1.0-alpha" ]]; then
            echo "APK_FILE=NEO-PLAYER-Alpha-0.1.apk" >> "$GITHUB_ENV"
            echo "APK_ARTIFACT=NEO-PLAYER-Alpha-0.1" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=NEO PLAYER Alpha 0.1" >> "$GITHUB_ENV"
          else
            echo "APK_FILE=NEO-PLAYER-Alpha-0.2.apk" >> "$GITHUB_ENV"
            echo "APK_ARTIFACT=NEO-PLAYER-Alpha-0.2" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=NEO PLAYER Alpha 0.2" >> "$GITHUB_ENV"
          fi

      - name: Name installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"

      - name: Upload Alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged private release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$APK_FILE" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file CHANGELOG.md
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
